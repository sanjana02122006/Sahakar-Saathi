[build]
  command = "npm run build"
  publish = "out"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SPA-style fallback for client-side auth redirects on static export.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
